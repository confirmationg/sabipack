<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SabiPack: Try the AI</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#0B7A4B">
<style>
body{font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:640px;margin-inline:auto;background:#F6F3EC;color:#14221C}
textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid #D9D4C7;border-radius:12px;background:#fff;color:#14221C}
textarea{min-height:170px}button{background:#0B7A4B;color:#fff;font-weight:700;border:0;margin-top:10px;min-height:48px;cursor:pointer}
button.alt{background:#F2B84B;color:#14221C}.note{font-size:14px;color:#4B5A52}.err{color:#B3261E;font-weight:700}.ok{color:#0B7A4B;font-weight:700}
.card{background:#fff;border:1px solid #D9D4C7;border-radius:16px;padding:14px;margin-top:14px}
.opt{text-align:left;background:#F6F3EC;color:#14221C;border:1px solid #D9D4C7;font-weight:400;margin-top:8px}.opt.good{background:#DDEBE2;border-color:#0B7A4B}.opt.bad{border-color:#B3261E}
@media(prefers-color-scheme:dark){body{background:#0F1A15;color:#EEF3EF}textarea,.card{background:#17261F;color:#EEF3EF;border-color:#2B4137}.opt{background:#0F1A15;color:#EEF3EF;border-color:#2B4137}.opt.good{background:#1E3A2E}.note{color:#A9B8AF}button{background:#3FBF85;color:#08130E}}
</style></head><body>
<picture><source media="(prefers-color-scheme: dark)" srcset="/logo-dark.svg"><img src="/logo.svg" alt="SabiPack" height="48" style="height:48px;width:auto"></picture>
<h1>Try the AI</h1>
<p class="note">Paste a few sentences of study notes. The AI turns them into a short lesson and quiz. Don’t paste names or personal details, and only use notes you have permission to use.</p>
<textarea id="t" aria-label="Your notes" placeholder="Paste notes here (400 to 3000 characters)"></textarea>
<button class="alt" id="s">Use sample notes</button>
<button id="g">Make my pack</button>
<p id="m" role="status"></p><div id="o"></div>
<script>
const $=s=>document.querySelector(s),el=(t,x,c)=>{const e=document.createElement(t);e.textContent=x;if(c)e.className=c;return e};
$('#s').onclick=()=>{$('#t').value='A cell is the basic unit of life. Every living thing is made of cells. The nucleus is like the control room of the cell. It holds the DNA and directs the cell’s activities. The cell membrane is a thin layer around the cell that controls what enters and leaves. Mitochondria are the cell’s power stations. They release energy from food through respiration. Plant cells also have a cell wall that gives them shape and strength, chloroplasts where photosynthesis happens, and a large vacuole that stores water and nutrients. Animal cells do not have cell walls or chloroplasts.'};
$('#g').onclick=async()=>{const m=$('#m'),o=$('#o');m.className='';m.textContent='The AI is writing your pack…';o.innerHTML='';
try{const r=await fetch('/api/try',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('#t').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong.');
m.className='ok';m.textContent='Done. Everything below now works without internet. Try airplane mode.';
const c=el('div','','card');c.append(el('h2',d.lesson.title),el('p',d.lesson.body));const L=el('button','Listen (your phone’s voice)','alt');L.onclick=()=>{try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(d.lesson.audio_script))}catch(e){}};c.append(L,el('p',d.meta.note,'note'));o.append(c);
d.questions.forEach((q,i)=>{const k=el('div','','card');k.append(el('b',(i+1)+'. '+q.stem));const w=el('p','','note');q.options.forEach((p,j)=>{const b=el('button','ABCD'[j]+') '+p,'opt');b.onclick=()=>{k.querySelectorAll('.opt').forEach((x,n)=>{x.disabled=true;if(n===q.answer_index)x.classList.add('good')});if(j!==q.answer_index)b.classList.add('bad');w.textContent=(j===q.answer_index?'Correct. ':'Not quite. ')+q.explanation};k.append(b)});k.append(w);o.append(k)})}
catch(e){m.className='err';m.textContent=e.message}};
</script></body></html>
