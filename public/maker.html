<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SabiPack Pack Maker</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><meta name="theme-color" content="#0B7A4B">
<style>
body{font:16px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:640px;margin-inline:auto;background:#F6F3EC;color:#14221C}
label{display:block;font-weight:700;margin:14px 0 4px}input,select,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border:1px solid #D9D4C7;border-radius:12px;background:#fff;color:#14221C}
textarea{min-height:150px}button{background:#0B7A4B;color:#fff;font-weight:700;border:0;margin-top:16px;min-height:48px;cursor:pointer}
button.alt{background:#F2B84B;color:#14221C}.note{font-size:14px;color:#4B5A52}.err{color:#B3261E;font-weight:700}
.card{background:#fff;border:1px solid #D9D4C7;border-radius:16px;padding:14px;margin-top:14px}.ok{color:#0B7A4B;font-weight:700}
@media(prefers-color-scheme:dark){body{background:#0F1A15;color:#EEF3EF}input,select,textarea,.card{background:#17261F;color:#EEF3EF;border-color:#2B4137}.note{color:#A9B8AF}button{background:#3FBF85;color:#08130E}button.alt{background:#F2B84B}}
</style></head><body>
<picture><source media="(prefers-color-scheme: dark)" srcset="/logo-dark.svg"><img src="/logo.svg" alt="SabiPack" height="48" style="height:48px;width:auto"></picture>
<h1>Pack Maker</h1>
<p class="note">Make a draft lesson pack from a source text. Every pack is a draft until a person has checked it.</p>
<label for="pc">Passcode</label><input id="pc" type="password" autocomplete="off">
<label for="sub">Sub-topic</label><select id="sub"></select>
<label for="url">Link to an OpenStax page (optional)</label><input id="url" placeholder="https://openstax.org/...">
<label for="txt">Or paste the source text</label><textarea id="txt"></textarea>
<label for="att">Source (book, section, link)</label><input id="att" placeholder="OpenStax, Biology 2e, section name, link">
<label for="lic">License shown on the page</label><input id="lic" placeholder="CC BY 4.0">
<p class="note">Check the license on the page yourself before you type it here. Only use text you have permission to use.</p>
<button id="go">Make draft pack</button>
<p id="msg" role="status"></p><div id="out"></div>
<script>
const $=s=>document.querySelector(s);let last=null;
fetch('/syllabus.json').then(r=>r.json()).then(d=>{$('#sub').innerHTML='';d.topics.forEach(t=>{const g=document.createElement('optgroup');g.label=t.number+'. '+t.title;t.subtopics.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.title;g.appendChild(o)});$('#sub').appendChild(g)})});
const el=(t,x,c)=>{const e=document.createElement(t);e.textContent=x;if(c)e.className=c;return e};
$('#go').onclick=async()=>{const m=$('#msg');m.className='';m.textContent='Working… this can take a little while.';$('#out').innerHTML='';
try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({passcode:$('#pc').value,subId:$('#sub').value,url:$('#url').value.trim(),text:$('#txt').value,attribution:$('#att').value,license:$('#lic').value})});
const d=await r.json();if(!r.ok)throw new Error(d.error||'Something went wrong.');last=d;m.className='ok';m.textContent='Draft pack ready. Read it carefully before saving.';
const o=$('#out'),c=el('div','','card');c.append(el('h2',d.lesson.title),el('p',d.lesson.body),el('b','Audio script'),el('p',d.lesson.audio_script));o.append(c);
d.questions.forEach((q,i)=>{const k=el('div','','card');k.append(el('b',(i+1)+'. '+q.stem));q.options.forEach((p,j)=>k.append(el('div',('ABCD'[j])+') '+p+(j===q.answer_index?'  ✓':''))));k.append(el('p','Why: '+q.explanation,'note'));o.append(k)});
const cp=el('button','Copy pack JSON');cp.onclick=()=>navigator.clipboard.writeText(JSON.stringify(last,null,1)).then(()=>cp.textContent='Copied');
const dl=el('button','Download pack JSON','alt');dl.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(last,null,1)],{type:'application/json'}));a.download=last.subtopic_id+'.json';a.click()};o.append(cp,dl)}
catch(e){m.className='err';m.textContent=e.message}};
</script></body></html>
